name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'qa'

        type: choice

        options:
          - dev
          - qa
          - uat
          - prod

      test_type:
        description: 'Test suite to execute'
        required: true
        default: 'all'

        type: choice

        options:
          - all
          - smoke
          - negative


jobs:

  # ============================================================
  # RUN PLAYWRIGHT TESTS
  # ============================================================

  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      TEST_ENV: ${{ inputs.environment || 'qa' }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}


    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v6

        with:
          node-version: 24
          cache: npm


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------------
      # Install Playwright browsers
      # --------------------------------------------------------

      - name: Install Playwright browsers
        run: npx playwright install --with-deps


      # --------------------------------------------------------
      # Run Playwright tests
      # --------------------------------------------------------

      - name: Run Playwright tests
        run: |

          if [ "${{ inputs.test_type }}" = "smoke" ]; then
            echo "Running SMOKE tests"
            npx playwright test --grep @smoke
          elif [ "${{ inputs.test_type }}" = "negative" ]; then
            echo "Running NEGATIVE tests"
            npx playwright test --grep @negative
          else
            echo "Running ALL tests"
            npx playwright test
          fi


      # --------------------------------------------------------
      # Upload Playwright HTML report as artifact
      # --------------------------------------------------------

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7

        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 30


      # --------------------------------------------------------
      # Upload test results
      # --------------------------------------------------------

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7


      # --------------------------------------------------------
      # Upload Winston logs
      # --------------------------------------------------------

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7


      # --------------------------------------------------------
      # Prepare HTML report for GitHub Pages
      # --------------------------------------------------------

      - name: Upload report for GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/


  # ============================================================
  # PUBLISH PLAYWRIGHT REPORT
  # ============================================================

  publish-report:
    name: Publish Playwright Report
    needs: playwright-tests

    # Publish report even if tests fail.
    # Don't run if workflow was cancelled.
    if: ${{ !cancelled() }}


    permissions:
      pages: write
      id-token: write


    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest


    steps:

      # --------------------------------------------------------
      # Deploy HTML report
      # --------------------------------------------------------

      - name: Deploy Playwright report
        id: deployment
        uses: actions/deploy-pages@v5


      # --------------------------------------------------------
      # Add report link to GitHub Actions Summary
      # --------------------------------------------------------

      - name: Add report link to summary

        run: |

          echo "## 🎭 Playwright Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📊 [Open HTML Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Environment: **${{ inputs.environment || 'qa' }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Test Suite: **${{ inputs.test_type || 'all' }}**" >> "$GITHUB_STEP_SUMMARY"