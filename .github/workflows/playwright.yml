name: Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

    inputs:

      environment:
        description: 'Environment'
        required: true
        default: 'qa'

        type: choice

        options:
          - dev
          - qa
          - uat
          - prod

      test_type:
        description: 'Test suite to execute'
        required: true
        default: 'all'

        type: choice

        options:
          - all
          - smoke
          - negative


jobs:

  # ============================================================
  # JOB 1 - RUN PLAYWRIGHT TESTS
  # ============================================================

  playwright-tests:

    name: Run Playwright Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:

      CI: true

      # For push / PR this defaults to QA.
      # For manual execution, it uses the selected environment.
      TEST_ENV: ${{ inputs.environment || 'qa' }}

      # Credentials are stored in GitHub Secrets.
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}


    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm


      # --------------------------------------------------------
      # Install project dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: npm ci


      # --------------------------------------------------------
      # Install Playwright browsers
      # --------------------------------------------------------

      - name: Install Playwright browsers
        run: npx playwright install --with-deps


      # --------------------------------------------------------
      # Run Playwright tests
      # --------------------------------------------------------

      - name: Run Playwright tests
        run: |

          if [ "${{ inputs.test_type }}" = "smoke" ]; then

            echo "Running SMOKE tests"

            npx playwright test --grep @smoke


          elif [ "${{ inputs.test_type }}" = "negative" ]; then

            echo "Running NEGATIVE tests"

            npx playwright test --grep @negative


          else

            echo "Running ALL tests"

            npx playwright test

          fi


      # --------------------------------------------------------
      # Upload Playwright HTML report as artifact
      # --------------------------------------------------------

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5

        with:

          name: playwright-report

          path: playwright-report/

          retention-days: 30


      # --------------------------------------------------------
      # Upload test results
      # --------------------------------------------------------

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5

        with:

          name: test-results

          path: test-results/

          retention-days: 7


      # --------------------------------------------------------
      # Upload Winston logs
      # --------------------------------------------------------

      - name: Upload test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5

        with:

          name: test-logs

          path: logs/

          retention-days: 7


      # --------------------------------------------------------
      # Prepare Playwright report for GitHub Pages
      # --------------------------------------------------------

      - name: Upload report for GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v4

        with:

          path: playwright-report/


  # ============================================================
  # JOB 2 - DEPLOY PLAYWRIGHT REPORT
  # ============================================================

  publish-report:

    name: Publish Playwright Report

    needs: playwright-tests

    # Run even when Playwright tests fail.
    # Do not run if the workflow itself was cancelled.
    if: ${{ !cancelled() }}


    # ----------------------------------------------------------
    # Permissions required by GitHub Pages
    # ----------------------------------------------------------

    permissions:

      pages: write

      id-token: write


    # ----------------------------------------------------------
    # GitHub Pages environment
    # ----------------------------------------------------------

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    runs-on: ubuntu-latest


    steps:

      # --------------------------------------------------------
      # Deploy report to GitHub Pages
      # --------------------------------------------------------

      - name: Deploy Playwright report

        id: deployment

        uses: actions/deploy-pages@v4


      # --------------------------------------------------------
      # ADD REPORT LINK TO GITHUB ACTIONS SUMMARY
      #
      # THIS GOES DIRECTLY AFTER THE DEPLOYMENT STEP
      # --------------------------------------------------------

      - name: Add report link to summary

        run: |

          echo "## 🎭 Playwright Test Report" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📊 [Open HTML Report](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "Environment: **${{ inputs.environment || 'qa' }}**" >> $GITHUB_STEP_SUMMARY

          echo "Test Suite: **${{ inputs.test_type || 'all' }}**" >> $GITHUB_STEP_SUMMARY
